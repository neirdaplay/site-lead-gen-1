<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Gabarit du hero : couvreur posant des tuiles, ciel bleu">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FCBEC"/>
      <stop offset="60%" stop-color="#BFE2F6"/>
      <stop offset="100%" stop-color="#DCEEF9"/>
    </linearGradient>
    <pattern id="tuiles" width="52" height="34" patternUnits="userSpaceOnUse">
      <rect width="52" height="34" fill="#5F6874"/>
      <path d="M0 33h52M26 0v33" stroke="#4A525C" stroke-width="4"/>
      <path d="M0 2h52" stroke="#727C89" stroke-width="3"/>
    </pattern>
    <pattern id="liteaux" width="40" height="46" patternUnits="userSpaceOnUse">
      <rect width="40" height="46" fill="#7E8794"/>
      <rect y="8" width="40" height="18" fill="#C9A469"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#ciel)"/>

  <!-- versant en cours de pose, a gauche -->
  <path d="M120 1000 L250 470 L880 470 L880 1000 Z" fill="url(#liteaux)"/>
  <!-- versant termine, a droite -->
  <path d="M880 470 L1560 470 L1600 1000 L880 1000 Z" fill="url(#tuiles)"/>
  <!-- faitage -->
  <path d="M240 470 H1580" stroke="#3F4650" stroke-width="26" stroke-linecap="round"/>

  <!-- silhouette du couvreur -->
  <g fill="#3A414B" opacity=".7">
    <path d="M1010 470 l34 -150 24 6 -18 144 z"/>
    <path d="M1096 470 l-26 -152 26 -6 30 152 z"/>
    <path d="M1040 316 q26 -34 58 -12 l14 34 q-40 20 -78 4 z"/>
    <circle cx="1112" cy="330" r="19"/>
  </g>
  <!-- piles de tuiles en attente -->
  <g fill="#4A525C" opacity=".45">
    <rect x="330" y="560" width="150" height="52" rx="8"/>
    <rect x="360" y="700" width="150" height="52" rx="8"/>
    <rect x="300" y="840" width="150" height="52" rx="8"/>
    <rect x="640" y="600" width="150" height="52" rx="8"/>
  </g>

  <!-- Aucun texte : ce gabarit sert de TEXTURE derriere le voile bleu nuit,
       il ne doit pas se lire. Le fichier a deposer par-dessus est
       assets/img/hero-couvreur.jpg (voir README.md). -->
</svg>
