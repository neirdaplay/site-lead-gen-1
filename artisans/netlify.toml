# ==================================================================
# Site Artisan — configuration Netlify
# Page unique, aucun build. Le seul fichier serveur est la fonction
# evenementielle netlify/functions/submission-created.js, declenchee
# automatiquement par Netlify Forms.
# ==================================================================

[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

# ------------------------------------------------------------------
# En-tetes. Liste blanche stricte : les seuls domaines tiers autorises
# sont ceux de la balise Google Ads. Le motif topographique et le
# favicon sont servis par ce site.
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.fr; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.fr https://pagead2.googlesyndication.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ------------------------------------------------------------------
# Redirections de confort vers les pages legales
# ------------------------------------------------------------------
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 301

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 301

[[redirects]]
  from = "/cgv"
  to = "/cgv.html"
  status = 301
