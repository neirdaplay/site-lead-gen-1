# ==================================================================
# Mon Couvreur Nord — configuration Netlify
# Site statique en fichier unique : aucun build, aucune dependance,
# aucun bundler. Le seul fichier serveur est la fonction evenementielle
# netlify/functions/submission-created.js, declenchee automatiquement
# par Netlify Forms. Aucune Edge Function.
# ==================================================================

[build]
  # Le site est a la racine du depot.
  publish = "."
  functions = "netlify/functions"
  # Pas de commande de build : les fichiers sont servis tels quels.
  command = ""

# ------------------------------------------------------------------
# En-tetes
# La politique reste en liste blanche stricte. Deux outils tiers y sont
# nommes, et deux seulement :
#   - Google Ads, pour la mesure des conversions ;
#   - Microsoft Clarity, pour la mesure d'audience. Clarity repartit sa
#     charge sur des sous-domaines a.clarity.ms a z.clarity.ms, d'ou le
#     joker ; c.bing.com sert a sa synchronisation.
# Tout le reste — polices, CDN, bibliotheques — reste interdit, et la
# page n'en charge aucun.
#
# Clarity et la balise Google sont chargees des le premier rendu. Ce
# n'est pas le chargement qui est conditionne au consentement, mais la
# mesure : Consent Mode v2 pour Google, l'API consentv2 pour Clarity.
# 'unsafe-inline' est necessaire pour le CSS et le JS inline, qui sont
# la contrainte du fichier unique.
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.fr https://*.clarity.ms https://c.bing.com; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.fr https://pagead2.googlesyndication.com https://*.clarity.ms https://c.bing.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com https://www.clarity.ms; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"

# Le HTML porte la personnalisation par commune : pas de cache partage.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ------------------------------------------------------------------
# Redirections de confort vers les pages legales
# ------------------------------------------------------------------
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 301

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 301

[[redirects]]
  from = "/cgu"
  to = "/conditions-generales.html"
  status = 301

[[redirects]]
  from = "/conditions-generales"
  to = "/conditions-generales.html"
  status = 301
